<main class="page">
  <h1 class="page__title">InvoiceIQ</h1>

  @if (apiHealth.isLoading()) {
    <p class="status">Checking the API…</p>
  } @else if (apiHealth.error()) {
    <p class="status status--down">API offline</p>
  } @else {
    <p class="status status--up">API {{ apiHealth.value() }}</p>
  }
</main>
<router-outlet />
